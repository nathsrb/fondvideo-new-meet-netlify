[build]
  command = "npm run build"
  publish = "dist"

[context.deploy-preview]
  command = "npx tsc --noEmit && npm run build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
